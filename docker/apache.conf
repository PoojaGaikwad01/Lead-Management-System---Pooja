# Listen on Render's $PORT (Dockerfile default 80; Render injects its own). Bind on all interfaces.
Listen 0.0.0.0:${PORT}
ServerName lead-system

# Keep memory within Render's free tier (512 MB).
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       10
    MaxConnectionsPerChild  500
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
